quarkus:
  http:
    http2: true
    port: 8088
    idle-timeout: 30s
    read-timeout: 30s

  devservices:
    enabled: false

  console:
    color: true
  log:
    level: INFO
    console:
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        queue-length: 4096
        overflow: discard
      enabled: true

    ## File Configuration
    file:
      path: /var/log/dte/server-${HOSTNAME:unknown}.log
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        enable: true
        queue-length: 8192
        overflow: discard
      rotation:
        max-file-size: 100M
        max-backup-index: 15
        rotate-on-boot: true
        file-suffix: .yyyy-MM-dd
      enabled: true
      level: INFO

    category:
      "org.apache.kafka":
        level: INFO
      "io.smallrye.reactive.messaging.kafka":
        level: INFO
      "io.quarkus.config":
        level: INFO
      "io.smallrye.config":
        level: INFO
      "com.csg.airtel.aaa4j":
        level: INFO

  otel:
    traces:
      exporter: none

  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics
    binder:
      jvm: true
      system: true
      vertx: true
      http-server:
        enabled: true
      http-client:
        enabled: true
      kafka:
        enabled: true

  smallrye-health:
    root-path: /q/health

  vertx:
    event-loops-pool-size: 2
    max-worker-execute-time: 60s
    internal-blocking-pool-size: 30
    warning-exception-time: 10s
    max-event-loop-execute-time: 5s
    prefer-native-transport: true

  thread-pool:
    max-threads: 80
    queue-size: 2000
    core-threads: 20


# WebClient pool tuned for K8s L4 load balancing.
# More connections with fewer streams per connection ensures each connection
# gets routed to a different pod by kube-proxy, achieving even distribution.
webclient:
  connect-timeout: 3000
  idle-timeout: 30000
  keep-alive: true
  http2-max-pool-size: 100
  http2-multiplexing-limit: 10
  http2-keep-alive-timeout: 30
