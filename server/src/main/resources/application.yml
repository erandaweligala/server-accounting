radius:
  auth:
    enabled: true
    port: 1812
    bind-address: 0.0.0.0

  accounting:
    enabled: true
    port: 1813
    bind-address: 0.0.0.0

  # Default shared secret — used for any BNG not listed under radius.bngs
  shared-secret: "SXAZsxaz#@$2026"
  fail-on-startup-error: true
  bngs:
    bng-1:
      id: bng-1
      address: 192.168.239.85
      shared-secret: SXAZsxaz#@$2026
      description: BNG1 - Region North
      enabled: true
      vendor: nokia
      location: north
      max-sessions: 10000

    bng-2:
      id: bng-2
      address: 127.0.0.1
      shared-secret: SXAZsxaz#@$2026
      description: BNG2 - Region South
      enabled: true
      vendor: cisco
      location: south
      max-sessions: 15000

    bng-3:
       id: bng-3
       address: 10.0.0.3
       shared-secret: secret_bng3
       description: BNG3 - Region East
       enabled: true
       vendor: huawei
       location: east
       max-sessions: 12000
  # ──────────────────────────────────────────────────────────────────────────

client:
  coa-port: 3799
  address: 172.0.0.1
  shared-secret: SXAZsxaz#@$2026

auth:
  service:
    url: http://airtel-aaa-auth-management-service-service.airtel-aaa.svc.cluster.local:8083/api/users/authenticate

kafka:
  bootstrap:
    servers: localhost:9092

# ===== KAFKA CONFIGURATION FOR 1000 TPS ======
mp:
  messaging:
    outgoing:
      accounting-events:
        connector: smallrye-kafka
        topic: accounting-dc
        value.serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        retries: 10
        enable.idempotence: true
        max.in.flight.requests.per.connection: 100
        compression.type: lz4
        batch.size: 131072
        linger.ms: 8
        buffer.memory: 134217728
        request.timeout.ms: 15000
        delivery.timeout.ms: 60000
        retry.backoff.ms: 100
        max.block.ms: 5000



